services:

  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: campuslab-oracle
    restart: unless-stopped

    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      BOOKINGS_DB_PASSWORD: ${BOOKINGS_DB_PASSWORD}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD}

    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./oracle/init:/container-entrypoint-initdb.d

    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 240s

    networks:
      - campuslab-network


  catalog:
    image: campuslab/catalog:${CAMPUSLAB_VERSION:-1.0.0}
    build:
      context: ../ms-campuslab-catalog
      dockerfile: Dockerfile

    container_name: campuslab-catalog
    restart: unless-stopped

    environment:
      SERVER_PORT: 8082

      DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      DB_USERNAME: CAMPUSLAB_CATALOG
      DB_PASSWORD: ${CATALOG_DB_PASSWORD}

      DDL_AUTO: update
      SHOW_SQL: false

    depends_on:
      oracle:
        condition: service_healthy

    networks:
      - campuslab-network


  bookings:
    image: campuslab/bookings:${CAMPUSLAB_VERSION:-1.0.0}
    build:
      context: ../ms-campuslab-bookings
      dockerfile: Dockerfile

    container_name: campuslab-bookings
    restart: unless-stopped

    environment:
      SERVER_PORT: 8081

      DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      DB_USERNAME: CAMPUSLAB_BOOKINGS
      DB_PASSWORD: ${BOOKINGS_DB_PASSWORD}

      DDL_AUTO: update
      SHOW_SQL: false
      CATALOG_SERVICE_URL: http://catalog:8082

      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

    depends_on:
      oracle:
        condition: service_healthy
      catalog:
        condition: service_started

    networks:
      - campuslab-network
      - kafka-net
  
  report:
    image: campuslab/report:${CAMPUSLAB_VERSION:-1.0.0}
    build:
      context: ../ms-campuslab-report
    container_name: campuslab-report
    environment:
      SERVER_PORT: 8084
      BOOKINGS_SERVICE_URL: http://bookings:8081
      CATALOG_SERVICE_URL: http://catalog:8082
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REPORT_KAFKA_ENABLED: ${REPORT_KAFKA_ENABLED:-true}
    depends_on:
      - bookings
      - catalog
    networks:
      - campuslab-network
      - kafka-net

  audit:
    image: campuslab/audit:${CAMPUSLAB_VERSION:-1.0.0}
    build:
      context: ../ms-campuslab-audit
    container_name: campuslab-audit
    environment:
      SERVER_PORT: 8085
      DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      DB_USERNAME: CAMPUSLAB_AUDIT
      DB_PASSWORD: ${AUDIT_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      oracle:
        condition: service_healthy
    networks:
      - campuslab-network
      - kafka-net

  notify:
    image: campuslab/notify:${CAMPUSLAB_VERSION:-1.0.0}
    build:
      context: ../ms-campuslab-notify
      dockerfile: Dockerfile

    container_name: campuslab-notify
    restart: unless-stopped

    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

    networks:
      - campuslab-network


  bff:
    image: campuslab/bff:${CAMPUSLAB_VERSION:-1.0.0}
    build:
      context: ../ms-campuslab-bff
      dockerfile: Dockerfile

    container_name: campuslab-bff
    restart: unless-stopped

    environment:
      SERVER_PORT: 8080

      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI}
      AZURE_AUDIENCE: ${AZURE_AUDIENCE}

      CATALOG_SERVICE_URL: http://catalog:8082
      BOOKINGS_SERVICE_URL: http://bookings:8081
      REPORT_SERVICE_URL: http://report:8084
      AUDIT_SERVICE_URL: http://audit:8085
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://100.30.46.47}
      SERVICES_HTTP_CONNECT_TIMEOUT: ${SERVICES_HTTP_CONNECT_TIMEOUT:-2s}
      SERVICES_HTTP_READ_TIMEOUT: ${SERVICES_HTTP_READ_TIMEOUT:-5s}

    depends_on:
      - catalog
      - bookings
      - report
      - audit

    ports:
      - "8080:8080"

    networks:
      - campuslab-network


volumes:
  oracle-data:



networks:
  campuslab-network:
    driver: bridge

  kafka-net:
    external: true
    name: campuslab-kafka_kafka-net
